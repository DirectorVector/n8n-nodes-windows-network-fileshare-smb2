# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Release flow: bump "version" in package.json, merge to master, then
#   git tag v<version> && git push origin v<version>
# Prerelease versions (e.g. 1.1.0-beta.1) publish under the "beta" dist-tag;
# everything else publishes as "latest". Provenance is attached automatically.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1
      - run: npm install -g npm@latest

      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:offline

      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) TAG=beta ;;
            *)   TAG=latest ;;
          esac
          npm publish --tag "$TAG"
